<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      html,
      body,
      #wb-source-preview-root {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
      }

      html {
        color-scheme: light;
        background: Canvas !important;
        color: CanvasText;
      }

      html[data-theme="dark"],
      html[data-wb-theme="dark"],
      html[data-preview-theme="dark"] {
        color-scheme: dark;
      }

      html[data-preview-theme="light"] {
        color-scheme: light;
      }

      body {
        overflow: visible;
        background: Canvas !important;
        color: CanvasText;
      }

      #wb-source-preview-root {
        background: transparent !important;
        background-image: none !important;
      }

      #wb-source-preview-root > .wb-source-visual-preview {
        width: 100%;
        height: 100%;
        min-height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="wb-source-preview-root"></div>
  </body>
</html>
